# Blueprint Render : API + PostgreSQL gere.
# Deploiement : Render > New > Blueprint, pointer sur ce depot.
# rootDir place le contexte de build dans truckspot/backend.
services:
  - type: web
    name: truckspot-api
    runtime: node
    plan: starter
    rootDir: truckspot/backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: truckspot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Delai au-dela duquel un camion sort de la carte faute de nouvelle
      # position. 1440 = 24 h.
      - key: TRUCK_POSITION_TTL_MINUTES
        value: 1440
      # Delai de grace apres l'heure de depart d'un trajet planifie.
      - key: TRIP_DEPARTURE_GRACE_HOURS
        value: 3
      # L'envoi de courriel est indispensable a la reinitialisation de mot de
      # passe : le pilote `log` n'envoie rien a personne.
      - key: MAIL_DRIVER
        value: smtp
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Renseigner l'URL publique du service une fois attribuee par Render.
      - key: PUBLIC_URL
        sync: false
      # Origines autorisees : URL du back-office Vercel, separees par des virgules.
      - key: CORS_ORIGINS
        sync: false
      # Le disque de Render est ephemere : le driver s3 est obligatoire ici,
      # sinon les documents disparaissent a chaque redeploiement.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: truckspot-db
    plan: basic-256mb
    postgresMajorVersion: '16'
