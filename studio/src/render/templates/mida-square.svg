<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gabarit carré Mida — 1080 × 1080, la surface de publication par défaut.

  Ce fichier est une couche : la photo du restaurant est composée EN DESSOUS par
  render/static.ts. Tout ce qui est ici se pose par-dessus, d'où le fond
  transparent et le dégradé qui rattrape la lisibilité du texte sur une photo
  dont on ne sait rien à l'avance.

  Couleurs : src/theme.js de Mida, à l'identique.
    #D8432B  primary        #191919  noir        #F5F5F3  fond clair
    #F5EDD6  cream          #c8975a  gold

  Les polices sont des jetons : Work Sans en français, Cairo en arabe — Work
  Sans n'a aucun glyphe arabe. Le mot-symbole « mida » garde Work Sans dans les
  deux langues : c'est une marque, pas du texte.

  La mise en page est symétrique. Chaque bloc reçoit son x et son ancre du code,
  pour que l'arabe se lise de droite à gauche sans second gabarit à maintenir.
  IMPORTANT : ne JAMAIS poser direction="rtl" sur un <text>. librsvg ne rend
  alors qu'un seul glyphe, sans erreur. Pango applique déjà le bidirectionnel
  d'après les caractères ; l'alignement passe par text-anchor.

  Jetons remplacés par render/static.ts — notés ici sans leurs accolades, pour
  que ce commentaire ne soit pas lui-même substitué :
    FONT_FAMILY                             famille, selon la langue
    W_XB, W_SB, W_RG                        graisses (800 / 600 / 400)
    BADGE_*                                 étiquette, côté début de ligne
    HEADLINE_LINES                          1 ou 2 lignes, positionnées côté code
    SUBLINE, TEXT_X, TEXT_ANCHOR            nom + quartier
    CTA, CTA_X, CTA_ANCHOR                  appel à l'action, côté fin de ligne
    RATING_TEXTE, RATING_X, RATING_TEXT_X   note, sans le « /5 »
  Les régions #if:x … /if:x (en commentaires XML) sont retirées quand la donnée
  manque.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">

  <defs>
    <!-- Assez haut pour couvrir deux lignes de titre, assez doux pour ne pas
         écraser la photo dans son tiers supérieur. -->
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#191919" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#191919" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#191919" stop-opacity="0.88"/>
      <stop offset="1.00" stop-color="#191919" stop-opacity="0.96"/>
    </linearGradient>
    <!-- Le haut reçoit son propre voile : l'étiquette et la note doivent tenir
         sur une photo claire comme sur une photo sombre. -->
    <linearGradient id="veilTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191919" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#191919" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0"   width="1080" height="260" fill="url(#veilTop)"/>
  <rect x="0" y="440" width="1080" height="640" fill="url(#veil)"/>

  <!-- Étiquette : un fait, sur l'accent unique de Mida. Capitales en français
       seulement — l'arabe n'a pas de casse. -->
  <g>
    <rect x="{{BADGE_X}}" y="72" width="{{BADGE_WIDTH}}" height="56" rx="28" fill="#D8432B"/>
    <text x="{{BADGE_TEXT_X}}" y="109" text-anchor="{{TEXT_ANCHOR}}"
          font-family="{{FONT_FAMILY}}" font-weight="{{W_SB}}" font-size="24" letter-spacing="1.2"
          fill="#FFFFFF">{{BADGE_TEXT}}</text>
  </g>

  <!--#if:rating-->
  <!-- Note moyenne, en crème plutôt qu'en blanc : elle ne doit pas concurrencer
       le titre. L'étoile est un glyphe, pas une image — rien à charger. -->
  <g>
    <rect x="{{RATING_X}}" y="72" width="132" height="56" rx="28"
          fill="#191919" fill-opacity="0.72"/>
    <text x="{{RATING_TEXT_X}}" y="110"
          font-family="{{FONT_FAMILY}}" font-weight="{{W_SB}}" font-size="26" fill="#F5EDD6">{{RATING_TEXTE}}</text>
  </g>
  <!--/if:rating-->

  <!-- Titre. Une ligne = un <text> avec son propre x/y : librsvg n'honore pas
       les x/y absolus posés sur des <tspan>, il les empile sur la ligne de base
       du <text> parent. Le style reste ici, la géométrie est calculée au rendu,
       et le bloc est calé sur sa dernière ligne pour que le bas de la
       composition ne bouge jamais. -->
  <g font-family="{{FONT_FAMILY}}" font-weight="{{W_XB}}" font-size="76" fill="#FFFFFF" text-anchor="{{TEXT_ANCHOR}}"
     >{{HEADLINE_LINES}}</g>

  <text x="{{TEXT_X}}" y="890" text-anchor="{{TEXT_ANCHOR}}" font-family="{{FONT_FAMILY}}" font-weight="{{W_RG}}" font-size="34"
        fill="#F5F5F3" fill-opacity="0.88">{{SUBLINE}}</text>

  <line x1="72" y1="936" x2="1008" y2="936" stroke="#F5F5F3" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Pied : la marque du côté où commence la lecture, l'appel à l'action du
       côté où elle finit — pour que le regard termine sur l'action, en
       français comme en arabe. Même ligne de base pour les deux. -->
  <text x="{{TEXT_X}}" y="1008" text-anchor="{{TEXT_ANCHOR}}"
        font-family="Work Sans" font-weight="800" font-size="40" fill="#D8432B">mida</text>
  <text x="{{CTA_X}}" y="1006" text-anchor="{{CTA_ANCHOR}}" font-family="{{FONT_FAMILY}}" font-weight="{{W_SB}}"
        font-size="28" fill="#F5F5F3">{{CTA}}</text>

</svg>
