  <div id="devbar" class="devbar" aria-label="Barre de développement (horloge virtuelle, réinitialisation)"></div>
  <a class="portal-link" href="../../wireframes/madrassatidz-portal.html">← Madrassatidz</a>

  <div class="app">
    <div id="normalTop">
      <div class="topbar">
        <div class="pips" id="pips"></div>

      </div>

    <div id="stage" role="main" aria-live="polite"></div>
  </div>
  <p class="credit">Fennec — prototype technique branché sur le vrai moteur SRS (db.mjs / srs.mjs / queue.mjs / sync.mjs). Design système appliqué (handoff « Fennec Design System — Complete »).<br>
  Assets audio/image pas encore produits : texte + synthèse vocale du navigateur en attendant.</p>

  <script type="module" src="./main.mjs"></script>
