name: AlloTruck

# Le depot heberge plusieurs projets : ce workflow ne se declenche que sur
# allotruck/ (et sur lui-meme), pour ne pas tourner a chaque changement de MIDA.
on:
  # Sur push uniquement : le resultat remonte deja comme statut de commit sur les
  # pull requests, alors qu'ajouter le declencheur pull_request ferait tourner
  # chaque commit deux fois.
  push:
    branches: ['**']
    paths:
      - 'allotruck/**'
      - '.github/workflows/allotruck.yml'
  workflow_dispatch:

concurrency:
  group: allotruck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — tests d'integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allotruck
          POSTGRES_PASSWORD: allotruck
          POSTGRES_DB: allotruck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allotruck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://allotruck:allotruck@localhost:5432/allotruck_test?schema=public
      # Base distincte : Prisma reinitialise la base fantome pour rejouer les
      # migrations, elle ne doit surtout pas etre celle des tests.
      SHADOW_DATABASE_URL: postgresql://allotruck:allotruck@localhost:5432/allotruck_shadow?schema=public
      JWT_SECRET: ci-secret-not-used-outside-continuous-integration
      NODE_ENV: test

    defaults:
      run:
        working-directory: allotruck/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: allotruck/backend/package-lock.json

      - run: npm ci

      - name: Creer la base fantome
        run: psql "${DATABASE_URL%%\?*}" -c 'CREATE DATABASE allotruck_shadow OWNER allotruck'
        env:
          PGPASSWORD: allotruck

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      # Echoue si schema.prisma a ete modifie sans migration correspondante.
      - name: Verifier que le schema et les migrations ne divergent pas
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      - run: npm test

      - name: Verifier le jeu de donnees de demonstration
        run: npm run seed

  admin:
    name: Back-office — tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: allotruck/frontend_admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: allotruck/frontend_admin/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile — tests et bundle Expo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: allotruck/frontend_mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: allotruck/frontend_mobile/package-lock.json

      - run: npm ci
      - run: npm test

      # Resout et transpile l'integralite du graphe de modules : toute import
      # cassee ou erreur de syntaxe fait echouer le job.
      - name: Bundler l'application
        run: npx expo export --platform android --dev --output-dir /tmp/allotruck-bundle
        env:
          EXPO_NO_TELEMETRY: '1'
